services:
  postgres:
    image: postgres:16-alpine
    container_name: genesis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis
    ports:
      - '5432:5432'
    volumes:
      - genesis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genesis -d genesis']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genesis-pgdata:
